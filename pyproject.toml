[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["notebooks", "data", ".venv", "experiments"]   # experiments/ = code goc cua Kiet/Uyen/Bao, giu nguyen de doi chieu

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",    # do dai dong: da dat line-length, khong canh bao lai
    "B008",    # Depends()/File() trong tham so mac dinh la cach dung dung cua FastAPI
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]        # test phai dat bien moi truong truoc khi import app
"app/*" = ["E402"]          # app phai them sys.path truoc khi import src

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
